version: '3.8'

services:
  # 1. Deterministic AI Microservice (FastAPI)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: infrasync-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - AI_MODE=demo
      - ENVIRONMENT=production
    networks:
      - infrasync-network

  # 2. Express.js REST API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infrasync-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:5173,http://localhost:3000
      - DATA_SOURCE=mock
      - STORAGE_ROOT=./storage/uploads
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_SERVICE_TIMEOUT_MS=10000
      - RATE_LIMIT_MAX_REQUESTS=120
    depends_on:
      - ai-service
    volumes:
      - backend-storage:/app/storage/uploads
    networks:
      - infrasync-network

  # 3. Optional MongoDB Database (Enable by setting DATA_SOURCE=mongodb)
  mongodb:
    image: mongo:6.0
    container_name: infrasync-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=infrasync
    volumes:
      - mongo-data:/data/db
    networks:
      - infrasync-network
    profiles:
      - with-db

networks:
  infrasync-network:
    driver: bridge

volumes:
  backend-storage:
  mongo-data:
